name: Build Brainyte POS Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainyte-pos-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and Upload Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Check Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/brainyte-pos-release.jks

          if [ ! -s android/app/brainyte-pos-release.jks ]; then
            echo "ERROR: Keystore file is empty or invalid."
            exit 1
          fi

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/brainyte-pos-release.jks
          EOF

      - name: Verify decoded keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore android/app/brainyte-pos-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias restaurant_mvp

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK file
        run: |
          echo "Checking generated Android App APK..."

          ls -lah build/app/outputs/bundle/release/

          if [ ! -s build/app/outputs/bundle/release/app-release.apk ]; then
            echo "ERROR: The APK file was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          du -h build/app/outputs/bundle/release/app-release.apk

      - name: Upload Signed Apk
        uses: actions/upload-artifact@v4
        with:
          name: brainyte-pos-android-release-apk
          path: build/app/outputs/bundle/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish build summary
        if: success()
        run: |
          echo "## Brainyte POS Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Format:** Android App Apk (.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** app-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retention:** 30 days" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The Signed APK is available in the workflow Artifacts section." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/brainyte-pos-release.jks
          
