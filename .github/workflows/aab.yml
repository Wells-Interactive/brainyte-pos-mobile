name: Build Brainyte POS Android AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brainyte-pos-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build and Upload Signed Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      # 4. Verify environment
      - name: Check Flutter and Java versions
        run: |
          flutter --version
          java -version

      # 5. Install Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 6. Decode Android release keystore
      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/brainyte-pos-release.jks

          if [ ! -s android/brainyte-pos-release.jks ]; then
            echo "ERROR: Keystore file is empty or invalid."
            exit 1
          fi

      # 7. Create Android signing properties
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=brainyte-pos-release.jks
          EOF

      # 8. Build signed Android App Bundle
      - name: Build Release AAB
        run: flutter build appbundle --release

      # 9. Verify generated AAB
      - name: Verify AAB file
        run: |
          echo "Checking generated Android App Bundle..."

          ls -lah build/app/outputs/bundle/release/

          if [ ! -s build/app/outputs/bundle/release/app-release.aab ]; then
            echo "ERROR: AAB file was not generated."
            exit 1
          fi

          echo "AAB successfully generated."
          du -h build/app/outputs/bundle/release/app-release.aab

      # 10. Upload AAB to GitHub Actions
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: brainyte-pos-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # 11. Add build information to workflow summary
      - name: Publish build summary
        if: success()
        run: |
          echo "## Brainyte POS Android Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Format:** Android App Bundle (.aab)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** app-release.aab" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retention:** 30 days" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed AAB is available in the workflow Artifacts section." >> "$GITHUB_STEP_SUMMARY"

      # 12. Remove sensitive signing files
      - name: Clean signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/brainyte-pos-release.jks
