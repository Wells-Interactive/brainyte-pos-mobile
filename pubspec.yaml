name: brainyte_pos
description: "Brainyte POS Mobile App is a modern, mobile-first Restaurant Point of Sale system built with Flutter and powered by PHP."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
