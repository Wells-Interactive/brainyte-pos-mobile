name: brainyte_pos
description: "Brainyte POS Mobile App is a modern, mobile-first Restaurant Point of Sale system built with Flutter and powered by PHP."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  shared_preferences: ^2.5.5
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  connectivity_plus: ^6.1.5
  # TODO: Re-enable Firebase after crash investigation
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3
  # firebase_crashlytics: ^4.1.3
  # firebase_performance: ^0.10.0+8
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/app_icon.png
